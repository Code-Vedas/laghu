# Packages load Laghu safely but leave transformation opt-in. Change this to
# `laghu on;` after the optimizer service and paths have been verified.
laghu off;
laghu preset balanced;
laghu worker_queue /run/laghu/jobs.queue;
laghu image_cache /var/cache/laghu/images;
