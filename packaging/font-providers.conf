# Laghu external font stylesheet providers.
# Exact HTTPS hosts and path prefixes only; reload Laghu after changes.

provider google_fonts
stylesheet fonts.googleapis.com /css
stylesheet fonts.googleapis.com /css2
asset fonts.gstatic.com /
max_css_bytes 262144
ttl_seconds 604800
end

provider fontsource_cdn
stylesheet cdn.jsdelivr.net /fontsource/css/
asset cdn.jsdelivr.net /fontsource/fonts/
max_css_bytes 262144
ttl_seconds 604800
end
