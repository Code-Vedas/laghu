load_module modules/ngx_http_laghu_module.so;

events {}

http {
  server {
    listen 8080;
    root /usr/share/nginx/html;

    laghu on;
    laghu preset balanced;

    # /api and /graphql are bypassed automatically. Override only a narrow
    # API-namespaced location that serves optimizable public assets.
    location /api/public-assets/ {
      laghu allow_api on;
    }
  }
}
