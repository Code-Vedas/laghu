title: Laghu
description: Native, fail-open content optimization for current NGINX releases.
url: https://laghu.codevedas.com
baseurl: ""
repository: Code-Vedas/laghu

theme: just-the-docs
markdown: kramdown

defaults:
  - scope:
      path: ""
    values:
      layout: default

permalink: pretty
heading_anchors: true
enable_copy_code_button: true
nav_enabled: true
search_enabled: true
search:
  heading_level: 3

callouts:
  note:
    title: Note
    color: blue

toc:
  depth: 2
  min_heading_level: 2
  max_heading_level: 3

aux_links:
  - title: Light / Dark
    url: "#toggle-theme"
    new_tab: false
  - title: Repository
    url: https://github.com/Code-Vedas/laghu
    new_tab: true
aux_links_new_tab: true

exclude:
  - Gemfile
  - Gemfile.lock
  - vendor
