# Production-scaling rail: four event processes under the same four-CPU quota
# given to the other Target-1 servers. 256 threads/process preserves the
# retained 1,000-VU active-request envelope without an unbounded setting; the
# four-CPU quota, not this connection capacity, defines CPU equivalence.
ServerLimit               4
ThreadLimit              256
StartServers              4
MinSpareThreads         256
MaxSpareThreads        1024
ThreadsPerChild         256
MaxRequestWorkers      1024
MaxConnectionsPerChild    0
AsyncRequestWorkerFactor  4
