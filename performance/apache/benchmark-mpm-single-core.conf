# Diagnostic rail: one event process with a bounded 1,024-thread concurrency
# envelope. The 1,000-VU retained matrix needs enough asynchronous connection
# capacity to avoid turning an Apache queue limit into client-side timeouts.
# The Compose one-CPU quota, not ThreadsPerChild or MaxRequestWorkers, is the
# CPU-equivalence control.
ServerLimit               1
ThreadLimit             1024
StartServers              1
MinSpareThreads         256
MaxSpareThreads        1024
ThreadsPerChild        1024
MaxRequestWorkers      1024
MaxConnectionsPerChild    0
AsyncRequestWorkerFactor  4
