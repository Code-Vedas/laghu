<VirtualHost *:80>
  DocumentRoot /srv/corpus
  <Directory /srv/corpus>
    Require all granted
  </Directory>
  ModPagespeed on
  ModPagespeedRewriteLevel CoreFilters
  ModPagespeedFileCachePath /var/cache/mod_pagespeed
  ModPagespeedEnableFilters collapse_whitespace,remove_comments,rewrite_images,recompress_images,convert_jpeg_to_webp
  ModPagespeedDisableFilters lazyload_images
  ModPagespeedImageRecompressionQuality 82
  ModPagespeedWebpRecompressionQuality 82
  ModPagespeedDisallow */never-optimized/*
  ModPagespeedDisallow */no-store.html
  ModPagespeedDisallow */private.html
  <Location /no-store.html>
    Header set Cache-Control "no-store"
  </Location>
  <Location /private.html>
    Header set Cache-Control "private"
  </Location>
</VirtualHost>
