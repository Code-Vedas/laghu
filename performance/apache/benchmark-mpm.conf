# Keep Apache capable of rail's fixed 1,000-VU peak. Debian default is 150.
ServerLimit              64
StartServers              4
MinSpareThreads          32
MaxSpareThreads         128
ThreadsPerChild          16
MaxRequestWorkers      1024
MaxConnectionsPerChild    0
