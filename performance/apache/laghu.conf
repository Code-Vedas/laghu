<VirtualHost *:80>
  ServerName alpha.bench.test
  ServerAlias beta.bench.test
  DocumentRoot /srv/corpus
  <Directory /srv/corpus>
    Require all granted
  </Directory>
  Laghu RewriteLevel core
  Laghu DisableFilter image_metadata
  Laghu DisableFilter image_dimensions
  Laghu DisableFilter image_responsive
  Laghu DisableFilter image_lazyload
  Laghu DisableFilter css_minify
  Laghu DisableFilter javascript_minify
  Laghu DisableFilter resource_hints
  Laghu DisableFilter cache_extension
  Laghu FileCacheBackend file:///var/cache/laghu/images
  Redirect 302 /redirect /redirect-target
  ProxyPass /proxy/ http://benchmark-origin:80/
  ProxyPassReverse /proxy/ http://benchmark-origin:80/
</VirtualHost>
