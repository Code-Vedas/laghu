load_module /usr/lib/nginx/modules/ngx_http_laghu_module.so;
worker_processes auto;
events { worker_connections 4096; }
http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  access_log off;
  laghu on;
  laghu rewrite_level core;
  # Laghu families map the five locked PageSpeed operations to HTML minify,
  # image recompression/rewrite, and JPEG-to-WebP; all other core work is off.
  laghu disable_filter image_metadata;
  laghu disable_filter image_dimensions;
  laghu disable_filter image_responsive;
  laghu disable_filter image_lazyload;
  laghu disable_filter css_minify;
  laghu disable_filter javascript_minify;
  laghu disable_filter resource_hints;
  laghu disable_filter cache_extension;
  laghu image_quality 82;
  server {
    listen 8080 default_server;
    server_name alpha.bench.test beta.bench.test;
    root /srv/corpus;
    laghu on;
    location = /redirect { return 302 /redirect-target; }
    location /proxy/ { proxy_pass http://benchmark-origin:80/; }
    location / { try_files $uri =404; }
  }
}
