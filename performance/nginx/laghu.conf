load_module /usr/lib/nginx/modules/ngx_http_laghu_module.so;
worker_processes auto;
worker_rlimit_nofile 8192;
pid /run/laghu/nginx.pid;
# Benchmark request volume must not be limited by Docker's JSON log pipe.
error_log /dev/stderr error;
events { worker_connections 4096; }
http {
  access_log off;
  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  sendfile on;
  laghu on;
  laghu rewrite_level experimental;
  laghu image_quality 82;
  laghu worker_queue /run/laghu/jobs.queue;
  laghu font_fetch_queue /run/laghu/fonts.queue;
  laghu font_provider_config /etc/laghu/font-providers.conf;
  laghu javascript_observation_config /etc/laghu/javascript-observation.conf;
  laghu javascript_defer_config /etc/laghu/javascript-defer.conf;
  laghu file_cache_backend file:///var/cache/laghu/images;
  laghu disallow /never-optimized/*;
  laghu rum_store local:;
  laghu rum_store_local_snapshot /var/lib/laghu/rum/rum.snapshot;
  laghu rum_store_required off;
  server {
    listen 8080;
    root /srv/corpus;
    laghu on;
    laghu rewrite_level experimental;
    laghu metrics on;
    laghu purge_token_file /etc/laghu/benchmark.token;
    laghu purge_allow 0.0.0.0/0;
    location = /.laghu/metrics {
      laghu on;
      laghu metrics on;
      laghu purge_token_file /etc/laghu/benchmark.token;
      laghu purge_allow 0.0.0.0/0;
      laghu worker_queue /run/laghu/jobs.queue;
      laghu font_fetch_queue /run/laghu/fonts.queue;
      laghu javascript_queue /run/laghu/javascript.queue;
      laghu file_cache_backend file:///var/cache/laghu/images;
    }
    location = /no-store.html { add_header Cache-Control no-store; }
    location = /private.html { add_header Cache-Control private; }
    location / { try_files $uri =404; }
  }
}
