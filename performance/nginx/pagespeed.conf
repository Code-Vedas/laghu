server {
  listen 8080 default_server;
  server_name alpha.bench.test beta.bench.test;
  root /srv/corpus;
  pagespeed on;
  pagespeed RewriteLevel PassThrough;
  pagespeed FileCachePath /var/cache/ngx_pagespeed;
  pagespeed EnableFilters collapse_whitespace,remove_comments,rewrite_images,recompress_images,convert_jpeg_to_webp;
  pagespeed ImageRecompressionQuality 82;
  pagespeed WebpRecompressionQuality 82;
  location = /redirect { return 302 /redirect-target; }
  location /proxy/ { proxy_pass http://benchmark-origin:80/; }
  location / { try_files $uri =404; }
}
