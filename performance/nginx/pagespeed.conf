server {
  listen 8080;
  root /srv/corpus;
  pagespeed on;
  pagespeed RewriteLevel CoreFilters;
  pagespeed FileCachePath /var/cache/ngx_pagespeed;
  pagespeed EnableFilters rewrite_images,recompress_images,convert_jpeg_to_webp;
  location / { try_files $uri =404; }
}
