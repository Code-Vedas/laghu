server {
  listen 8080;
  root /srv/corpus;
  pagespeed on;
  pagespeed RewriteLevel CoreFilters;
  pagespeed FileCachePath /var/cache/ngx_pagespeed;
  pagespeed EnableFilters collapse_whitespace,remove_comments,rewrite_images,recompress_images,convert_jpeg_to_webp;
  pagespeed DisableFilters lazyload_images;
  pagespeed ImageRecompressionQuality 82;
  pagespeed WebpRecompressionQuality 82;
  pagespeed Disallow */never-optimized/*;
  pagespeed Disallow */no-store.html;
  pagespeed Disallow */private.html;
  location = /no-store.html { add_header Cache-Control no-store; }
  location = /private.html { add_header Cache-Control private; }
  location / { try_files $uri =404; }
}
