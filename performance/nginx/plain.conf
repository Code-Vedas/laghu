worker_processes auto;
worker_rlimit_nofile 8192;
pid /tmp/nginx.pid;
events { worker_connections 4096; }
http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  sendfile on;
  gzip_static on;
  gzip_vary on;
  gzip_types text/css application/javascript application/json image/svg+xml text/html text/plain text/xml;
  brotli_static on;
  brotli_types text/css application/javascript application/json image/svg+xml text/html text/plain text/xml;
  map $http_accept $plain_webp_suffix {
    default "";
    "~*image/webp" ".webp";
  }
  server {
    listen 8080;
    root /var/cache/plain-corpus;
    location = /no-store.html { add_header Cache-Control no-store; }
    location = /private.html { add_header Cache-Control private; }
    location ~ ^/(?<plain_image>.+)\.(?:jpe?g|png)$ {
      add_header Cache-Control "public, max-age=3600" always;
      add_header Vary "Accept, Accept-Encoding" always;
      try_files /$plain_image$plain_webp_suffix $uri =404;
    }
    location / {
      add_header Cache-Control "public, max-age=3600" always;
      add_header Vary "Accept, Accept-Encoding" always;
      try_files $uri =404;
    }
  }
}
