worker_processes auto;
pid /tmp/nginx.pid;
events { worker_connections 1024; }
http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  sendfile on;
  gzip on;
  server {
    listen 8080;
    root /srv/corpus;
    location = /no-store.html { add_header Cache-Control no-store; }
    location = /private.html { add_header Cache-Control private; }
    location / { try_files $uri =404; }
  }
}
