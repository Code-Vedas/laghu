version: 2
updates:
  - package-ecosystem: cargo
    directory: /workers/laghu-js-optimize
    schedule:
      interval: weekly
    groups:
      cargo:
        patterns:
          - "*"

  - package-ecosystem: bundler
    directory: /docs
    schedule:
      interval: weekly
    groups:
      docs:
        patterns:
          - "*"

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns:
          - "*"

  - package-ecosystem: docker
    directory: /packaging/container
    schedule:
      interval: weekly
    groups:
      container-images:
        patterns:
          - "*"
