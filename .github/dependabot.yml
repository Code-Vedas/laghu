version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      github-actions:
        patterns:
          - '*'
  - package-ecosystem: bundler
    directory: /danger
    schedule:
      interval: weekly
    groups:
      bundler:
        patterns:
          - '*'
