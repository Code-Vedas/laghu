# SPDX-License-Identifier: AGPL-3.0-only
name: Toolchain

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  toolchain:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: gcc-14-libstdc++
            compiler: g++-14
            packages: g++-14
          - name: clang-19-libc++
            compiler: clang++-19
            packages: clang-19 libc++-19-dev libc++abi-19-dev
            cxxflags: -stdlib=libc++
    name: ${{ matrix.name }}
    steps:
      - uses: actions/checkout@v7
      - name: Install compiler and standard library
        run: |
          sudo rm -f /etc/apt/sources.list.d/google-chrome.list \
            /etc/apt/sources.list.d/google-chrome.sources
          sudo add-apt-repository --yes ppa:ubuntu-toolchain-r/test
          sudo apt-get update
          sudo apt-get install --yes ninja-build libc-ares-dev libcrypt-dev libidn2-dev libnghttp2-dev libprotobuf-c-dev ${{ matrix.packages }}
      - name: Verify C++23 toolchain contract
        env:
          CXXFLAGS: ${{ matrix.cxxflags }}
        run: scripts/check-toolchain --cxx "${{ matrix.compiler }}" --out "$RUNNER_TEMP/laghu-toolchain"
      - name: Verify full vendored static configuration
        if: matrix.name == 'gcc-14-libstdc++'
        run: |
          cmake -S . -B "$RUNNER_TEMP/laghu-full" -G Ninja \
            -DCMAKE_CXX_COMPILER="${{ matrix.compiler }}" \
            -DLAGHU_BUILD_PROFILE=FULL
          cmake --build "$RUNNER_TEMP/laghu-full" --target \
            laghu_crypto_provider_test laghu_idna_test laghu_password_auth_test \
            laghu_password_auth_failure_token_test laghu_http2_test laghu_http2_contract_test \
            laghu_http3_test laghu_http3_contract_test laghu_dns_test laghu_dns_contract_test \
            laghu_otlp_test laghu_otlp_contract_test
          ctest --test-dir "$RUNNER_TEMP/laghu-full" --output-on-failure \
            -R '^laghu\.(crypto\.provider|adapters\.(idna|password_auth|password_auth\.failure_token|http2|http2\.contract|http3|http3\.contract|dns|dns\.contract|otlp|otlp\.contract))$'
      - name: Verify system dynamic IDNA and password adapters
        if: matrix.name == 'gcc-14-libstdc++'
        run: |
          cmake -S . -B "$RUNNER_TEMP/laghu-system-adapters" -G Ninja \
            -DCMAKE_CXX_COMPILER="${{ matrix.compiler }}" \
            -DLAGHU_BUILD_PROFILE=CUSTOM \
            '-DLAGHU_FEATURES=idna;password_auth;http2;async_dns;otlp' \
            -DLAGHU_DEPENDENCY_SOURCE=SYSTEM \
            -DLAGHU_DEPENDENCY_LINK_MODE=DYNAMIC
          cmake --build "$RUNNER_TEMP/laghu-system-adapters" --target \
            laghu_idna_test laghu_password_auth_test laghu_password_auth_failure_token_test \
            laghu_http2_test laghu_http2_contract_test laghu_dns_test laghu_dns_contract_test \
            laghu_otlp_test laghu_otlp_contract_test
          ctest --test-dir "$RUNNER_TEMP/laghu-system-adapters" --output-on-failure \
            -R '^laghu\.adapters\.(idna|password_auth|password_auth\.failure_token|http2|http2\.contract|dns|dns\.contract|otlp|otlp\.contract)$'
      - name: Verify Clang 19 crypto adapter
        if: matrix.name == 'clang-19-libc++'
        run: |
          cmake -S . -B "$RUNNER_TEMP/laghu-clang-crypto" -G Ninja \
            -DCMAKE_CXX_COMPILER="${{ matrix.compiler }}" \
            -DCMAKE_CXX_FLAGS="${{ matrix.cxxflags }}" \
            -DLAGHU_BUILD_PROFILE=CUSTOM \
            -DLAGHU_FEATURES=tls
          cmake --build "$RUNNER_TEMP/laghu-clang-crypto" \
            --target laghu_crypto_provider_test
          ctest --test-dir "$RUNNER_TEMP/laghu-clang-crypto" --output-on-failure \
            -R '^laghu.crypto.provider$'
      - name: Verify Clang 19 IDNA and password adapters
        if: matrix.name == 'clang-19-libc++'
        run: |
          cmake -S . -B "$RUNNER_TEMP/laghu-clang-adapters" -G Ninja \
            -DCMAKE_CXX_COMPILER="${{ matrix.compiler }}" \
            -DCMAKE_CXX_FLAGS="${{ matrix.cxxflags }}" \
            -DLAGHU_BUILD_PROFILE=CUSTOM \
            '-DLAGHU_FEATURES=idna;password_auth;http2;http3;async_dns;otlp'
          cmake --build "$RUNNER_TEMP/laghu-clang-adapters" --target \
            laghu_idna_test laghu_password_auth_test laghu_password_auth_failure_token_test \
            laghu_http2_test laghu_http2_contract_test laghu_http3_test laghu_http3_contract_test \
            laghu_dns_test laghu_dns_contract_test laghu_otlp_test laghu_otlp_contract_test
          ctest --test-dir "$RUNNER_TEMP/laghu-clang-adapters" --output-on-failure \
            -R '^laghu\.adapters\.(idna|password_auth|password_auth\.failure_token|http2|http2\.contract|http3|http3\.contract|dns|dns\.contract|otlp|otlp\.contract)$'
      - name: Verify LibreSSL crypto adapter
        if: matrix.name == 'gcc-14-libstdc++'
        run: |
          cmake -S . -B "$RUNNER_TEMP/laghu-libressl" -G Ninja \
            -DCMAKE_CXX_COMPILER="${{ matrix.compiler }}" \
            -DLAGHU_BUILD_PROFILE=CUSTOM \
            -DLAGHU_FEATURES=tls \
            -DLAGHU_TLS_PROVIDER=LIBRESSL
          cmake --build "$RUNNER_TEMP/laghu-libressl" \
            --target laghu_crypto_provider_test
          ctest --test-dir "$RUNNER_TEMP/laghu-libressl" --output-on-failure \
            -R '^laghu.crypto.provider$'
      - name: Verify GCC 14 release reproducibility
        if: matrix.name == 'gcc-14-libstdc++'
        run: |
          cmake -S . -B "$RUNNER_TEMP/laghu-reproducible" -G Ninja \
            -DCMAKE_CXX_COMPILER="${{ matrix.compiler }}" \
            -DCMAKE_BUILD_TYPE=Release
          ctest --test-dir "$RUNNER_TEMP/laghu-reproducible" \
            --output-on-failure -R '^laghu.build.reproducible_staging$'
      - uses: actions/upload-artifact@v7
        with:
          name: toolchain-capabilities-${{ matrix.name }}
          path: |
            ${{ runner.temp }}/laghu-toolchain/config/laghu-config-v1.json
            ${{ runner.temp }}/laghu-toolchain/probes/toolchain-capabilities-v1.json
            ${{ runner.temp }}/laghu-toolchain/probes/*.log
          if-no-files-found: error
  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install canonical generator
        run: brew install ninja openssl@3
      - name: Verify Apple Clang toolchain contract
        run: scripts/check-toolchain --cxx clang++ --out "$RUNNER_TEMP/laghu-toolchain"
      - name: Verify Apple Clang crypto adapter
        run: |
          export PKG_CONFIG_PATH="$(brew --prefix openssl@3)/lib/pkgconfig"
          cmake -S . -B "$RUNNER_TEMP/laghu-crypto" -G Ninja \
            -DCMAKE_CXX_COMPILER=clang++ \
            -DLAGHU_BUILD_PROFILE=CUSTOM \
            -DLAGHU_FEATURES=tls \
            -DLAGHU_DEPENDENCY_SOURCE=SYSTEM \
            -DLAGHU_DEPENDENCY_LINK_MODE=DYNAMIC
          cmake --build "$RUNNER_TEMP/laghu-crypto" \
            --target laghu_crypto_provider_test
          ctest --test-dir "$RUNNER_TEMP/laghu-crypto" --output-on-failure \
            -R '^laghu.crypto.provider$'
      - name: Verify Apple Clang IDNA and password adapters
        run: |
          cmake -S . -B "$RUNNER_TEMP/laghu-adapters" -G Ninja \
            -DCMAKE_CXX_COMPILER=clang++ \
            -DLAGHU_BUILD_PROFILE=CUSTOM \
            '-DLAGHU_FEATURES=idna;password_auth;http2;http3;async_dns;otlp'
          cmake --build "$RUNNER_TEMP/laghu-adapters" --target \
            laghu_idna_test laghu_password_auth_test laghu_password_auth_failure_token_test \
            laghu_http2_test laghu_http2_contract_test laghu_http3_test laghu_http3_contract_test \
            laghu_dns_test laghu_dns_contract_test laghu_otlp_test laghu_otlp_contract_test
          ctest --test-dir "$RUNNER_TEMP/laghu-adapters" --output-on-failure \
            -R '^laghu\.adapters\.(idna|password_auth|password_auth\.failure_token|http2|http2\.contract|http3|http3\.contract|dns|dns\.contract|otlp|otlp\.contract)$'
      - uses: actions/upload-artifact@v7
        with:
          name: toolchain-capabilities-macos-appleclang
          path: |
            ${{ runner.temp }}/laghu-toolchain/config/laghu-config-v1.json
            ${{ runner.temp }}/laghu-toolchain/probes/toolchain-capabilities-v1.json
            ${{ runner.temp }}/laghu-toolchain/probes/*.log
          if-no-files-found: error
  freebsd:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: vmactions/freebsd-vm@f0552d3b69211736abd97f02ff3d4674c56b73b1
        with:
          release: '15.1'
          usesh: true
          prepare: pkg install -y cmake ninja gmake perl5
          run: |
            scripts/check-toolchain --cxx clang++ --out /tmp/laghu-toolchain
            cmake -S . -B /tmp/laghu-crypto -G Ninja \
              -DCMAKE_CXX_COMPILER=clang++ \
              -DLAGHU_BUILD_PROFILE=CUSTOM \
              -DLAGHU_FEATURES=tls
            cmake --build /tmp/laghu-crypto --target laghu_crypto_provider_test
            ctest --test-dir /tmp/laghu-crypto --output-on-failure \
              -R '^laghu.crypto.provider$'
            cmake -S . -B /tmp/laghu-adapters -G Ninja \
              -DCMAKE_CXX_COMPILER=clang++ \
              -DLAGHU_BUILD_PROFILE=CUSTOM \
              '-DLAGHU_FEATURES=idna;password_auth;http2;http3;async_dns;otlp'
            cmake --build /tmp/laghu-adapters --target \
              laghu_idna_test laghu_password_auth_test laghu_password_auth_failure_token_test \
              laghu_http2_test laghu_http2_contract_test laghu_http3_test laghu_http3_contract_test \
              laghu_dns_test laghu_dns_contract_test laghu_otlp_test laghu_otlp_contract_test
            ctest --test-dir /tmp/laghu-adapters --output-on-failure \
              -R '^laghu\.adapters\.(idna|password_auth|password_auth\.failure_token|http2|http2\.contract|http3|http3\.contract|dns|dns\.contract|otlp|otlp\.contract)$'
  linux-aarch64-cross:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Install ARM64 GCC cross toolchain
        run: |
          sudo rm -f /etc/apt/sources.list.d/google-chrome.list \
            /etc/apt/sources.list.d/google-chrome.sources
          sudo add-apt-repository --yes ppa:ubuntu-toolchain-r/test
          sudo apt-get update
          sudo apt-get install --yes ninja-build g++-14-aarch64-linux-gnu
      - name: Configure, compile, archive, and validate ARM64 contract
        run: |
          cmake --preset linux-aarch64-gcc \
            -DLAGHU_BUILD_PROFILE=CUSTOM \
            '-DLAGHU_FEATURES=tls;http2;http3;async_dns;otlp'
          cmake --build build/linux-aarch64-gcc --target laghu_verify_toolchain
      - name: Verify ARM64 archive
        run: |
          test -f build/linux-aarch64-gcc/liblaghu_core.a
          aarch64-linux-gnu-ar t build/linux-aarch64-gcc/liblaghu_core.a
          test -f build/linux-aarch64-gcc/liblaghu_crypto.a
          aarch64-linux-gnu-ar t build/linux-aarch64-gcc/liblaghu_crypto.a
          test -f build/linux-aarch64-gcc/liblaghu_http2.a
          aarch64-linux-gnu-ar t build/linux-aarch64-gcc/liblaghu_http2.a
          test -f build/linux-aarch64-gcc/liblaghu_quic.a
          aarch64-linux-gnu-ar t build/linux-aarch64-gcc/liblaghu_quic.a
          test -f build/linux-aarch64-gcc/liblaghu_http3.a
          aarch64-linux-gnu-ar t build/linux-aarch64-gcc/liblaghu_http3.a
          test -f build/linux-aarch64-gcc/liblaghu_dns.a
          aarch64-linux-gnu-ar t build/linux-aarch64-gcc/liblaghu_dns.a
          test -f build/linux-aarch64-gcc/liblaghu_otlp.a
          aarch64-linux-gnu-ar t build/linux-aarch64-gcc/liblaghu_otlp.a
  linux-clang-asan-ubsan:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Install Linux Clang ASan and UBSan toolchain
        run: |
          sudo rm -f /etc/apt/sources.list.d/google-chrome.list \
            /etc/apt/sources.list.d/google-chrome.sources
          sudo apt-get update
          sudo apt-get install --yes ninja-build clang-19 libclang-rt-19-dev libc++-19-dev libc++abi-19-dev
      - name: Run ordinary native suite under ASan and UBSan
        run: |
          cmake --preset linux-clang-asan-ubsan
          cmake --build build/linux-clang-asan-ubsan --target laghu_verify_toolchain
      - name: Run TLS crypto adapter under ASan and UBSan
        run: |
          cmake -S . -B "$RUNNER_TEMP/laghu-asan-crypto" -G Ninja \
            -DCMAKE_CXX_COMPILER=clang++-19 \
            -DCMAKE_CXX_FLAGS=-stdlib=libc++ \
            -DLAGHU_SANITIZER_PROFILE=ASAN_UBSAN \
            -DLAGHU_BUILD_PROFILE=CUSTOM \
            -DLAGHU_FEATURES=tls
          cmake --build "$RUNNER_TEMP/laghu-asan-crypto" \
            --target laghu_crypto_provider_test laghu_crypto_entropy_seam_test
          ctest --test-dir "$RUNNER_TEMP/laghu-asan-crypto" --output-on-failure \
            -R '^laghu.crypto.provider$'
          ctest --test-dir "$RUNNER_TEMP/laghu-asan-crypto" --output-on-failure \
            -R '^laghu.crypto.entropy_seam$'
      - name: Run IDNA and password adapters under ASan and UBSan
        run: |
          cmake -S . -B "$RUNNER_TEMP/laghu-asan-adapters" -G Ninja \
            -DCMAKE_CXX_COMPILER=clang++-19 \
            -DCMAKE_CXX_FLAGS=-stdlib=libc++ \
            -DLAGHU_SANITIZER_PROFILE=ASAN_UBSAN \
            -DLAGHU_BUILD_PROFILE=CUSTOM \
            '-DLAGHU_FEATURES=idna;password_auth;http2;http3;async_dns;otlp'
          cmake --build "$RUNNER_TEMP/laghu-asan-adapters" --target \
            laghu_idna_test laghu_password_auth_test laghu_password_auth_failure_token_test \
            laghu_http2_test laghu_http2_contract_test laghu_http3_test laghu_http3_contract_test \
            laghu_dns_test laghu_dns_contract_test laghu_otlp_test laghu_otlp_contract_test
          ctest --test-dir "$RUNNER_TEMP/laghu-asan-adapters" --output-on-failure \
            -R '^laghu\.adapters\.(idna|password_auth|password_auth\.failure_token|http2|http2\.contract|http3|http3\.contract|dns|dns\.contract|otlp|otlp\.contract)$'
      - name: Replay binary-envelope fuzz corpus under ASan and UBSan
        run: |
          cmake -S . -B "$RUNNER_TEMP/laghu-fuzz" -G Ninja \
            -DCMAKE_CXX_COMPILER=clang++-19 \
            -DLAGHU_SANITIZER_PROFILE=ASAN_UBSAN \
            -DLAGHU_BUILD_FUZZERS=ON
          scripts/fuzz --build "$RUNNER_TEMP/laghu-fuzz" \
            --target binary-envelope --corpus fuzz/corpus/binary-envelope --runs 1
          ctest --test-dir "$RUNNER_TEMP/laghu-fuzz" --output-on-failure \
            -R '^laghu\.fuzz\.wrapper$'
          ctest --test-dir "$RUNNER_TEMP/laghu-fuzz" --output-on-failure \
            -R '^laghu\.fuzz\.release_exclusion$'
          ctest --test-dir "$RUNNER_TEMP/laghu-fuzz" --output-on-failure \
            -R '^laghu\.fuzz\.default_all_exclusion$'
      - name: Run bounded binary-envelope fuzz campaign
        continue-on-error: true
        run: |
          scripts/fuzz --build "$RUNNER_TEMP/laghu-fuzz" \
            --target binary-envelope --corpus fuzz/corpus/binary-envelope --runs 10000
  linux-clang-tsan:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Install Linux Clang ThreadSanitizer toolchain
        run: |
          sudo rm -f /etc/apt/sources.list.d/google-chrome.list \
            /etc/apt/sources.list.d/google-chrome.sources
          sudo apt-get update
          sudo apt-get install --yes ninja-build clang-19 libc++-19-dev libc++abi-19-dev
      - name: Run concurrency targets under ThreadSanitizer
        run: |
          cmake --preset linux-clang-tsan
          cmake --build build/linux-clang-tsan --target laghu_sanitizer_tsan_tests
  static-analysis-hardening:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Install static-analysis toolchain
        run: |
          sudo rm -f /etc/apt/sources.list.d/google-chrome.list \
            /etc/apt/sources.list.d/google-chrome.sources
          sudo apt-get update
          sudo apt-get install --yes ninja-build clang-19 clang-tidy-19 clang-tools-19 cppcheck
      - name: Analyze Laghu-owned code and verify Release hardening
        run: |
          cmake -S . -B "$RUNNER_TEMP/laghu-static-analysis" -G Ninja \
            -DCMAKE_CXX_COMPILER=clang++-19 \
            -DLAGHU_STATIC_ANALYSIS=ON
          cmake --build "$RUNNER_TEMP/laghu-static-analysis" --target laghu_static_analysis
          cmake --build "$RUNNER_TEMP/laghu-static-analysis" --target laghu_verify_toolchain
          cmake -S . -B "$RUNNER_TEMP/laghu-static-analysis-tls" -G Ninja \
            -DCMAKE_CXX_COMPILER=clang++-19 \
            -DLAGHU_STATIC_ANALYSIS=ON \
            -DLAGHU_BUILD_PROFILE=CUSTOM \
            '-DLAGHU_FEATURES=tls;async_dns'
          cmake --build "$RUNNER_TEMP/laghu-static-analysis-tls" --target laghu_static_analysis
          cmake -S . -B "$RUNNER_TEMP/laghu-release-hardening" -G Ninja \
            -DCMAKE_CXX_COMPILER=clang++-19 \
            -DCMAKE_BUILD_TYPE=Release
          cmake --build "$RUNNER_TEMP/laghu-release-hardening" --target laghu
          ctest --test-dir "$RUNNER_TEMP/laghu-release-hardening" --output-on-failure \
            -R '^laghu.hardening.'
          readelf -h "$RUNNER_TEMP/laghu-release-hardening/laghu" | grep 'Type:.*DYN'
          readelf -l "$RUNNER_TEMP/laghu-release-hardening/laghu" | grep GNU_RELRO
          readelf -d "$RUNNER_TEMP/laghu-release-hardening/laghu" | grep BIND_NOW
          if readelf -d "$RUNNER_TEMP/laghu-release-hardening/laghu" | grep -q TEXTREL; then
            echo "Laghu Release executable contains text relocations" >&2
            exit 1
          fi
  supply-chain:
    permissions:
      contents: read
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Install schema validator
        run: |
          sudo apt-get update
          sudo apt-get install --yes ninja-build python3-jsonschema
      - name: Generate and verify unsigned supply-chain artifacts
        run: |
          cmake -S . -B "$RUNNER_TEMP/laghu-supply-chain" -G Ninja \
            -DCMAKE_CXX_COMPILER=g++-14
          ctest --test-dir "$RUNNER_TEMP/laghu-supply-chain" \
            --output-on-failure -R '^laghu.supply_chain.validation$'
      - name: Validate pinned official SPDX and CycloneDX schemas
        run: |
          schema_dir="$RUNNER_TEMP/laghu-schemas"
          mkdir -p "$schema_dir"
          curl --fail --location --silent --show-error \
            https://spdx.org/schema/3.0.1/spdx-json-schema.json \
            --output "$schema_dir/spdx-3.0.1.schema.json"
          curl --fail --location --silent --show-error \
            https://raw.githubusercontent.com/CycloneDX/specification/4b3f59453366e27c8073fd24e98bf21ef8892c8e/schema/bom-1.7.schema.json \
            --output "$schema_dir/bom-1.7.schema.json"
          curl --fail --location --silent --show-error \
            https://raw.githubusercontent.com/CycloneDX/specification/4b3f59453366e27c8073fd24e98bf21ef8892c8e/schema/spdx.schema.json \
            --output "$schema_dir/spdx.schema.json"
          curl --fail --location --silent --show-error \
            https://raw.githubusercontent.com/CycloneDX/specification/4b3f59453366e27c8073fd24e98bf21ef8892c8e/schema/jsf-0.82.schema.json \
            --output "$schema_dir/jsf-0.82.schema.json"
          cd "$schema_dir"
          printf '%s  %s\n' \
            582c64e809d5b3ef9bd0c4de13a32391b47b0284a3e8d199569fb96f649234b1 spdx-3.0.1.schema.json \
            df472ef4aaf593904c479293723a1a5c191d6672715c93b3c0b5c318f3914221 bom-1.7.schema.json \
            54a6288292bc6c90b0d3952f5f939f17436fa76704ffe68a46e5b78539c7cc1b spdx.schema.json \
            8bae002c25e723db7ee1f26afde680ae1a2b1a8f6b4b4b0fd65dc3becb090aae jsf-0.82.schema.json \
            | sha256sum --check --strict
          python3 -m jsonschema \
            --instance "$RUNNER_TEMP/laghu-supply-chain/config/laghu-spdx-3.0.1.spdx.json" \
            spdx-3.0.1.schema.json
          python3 -m jsonschema \
            --instance "$RUNNER_TEMP/laghu-supply-chain/config/laghu-cyclonedx-1.7.cdx.json" \
            bom-1.7.schema.json
          jq 'del(."@context")' \
            "$RUNNER_TEMP/laghu-supply-chain/config/laghu-spdx-3.0.1.spdx.json" \
            > invalid-spdx.json
          if python3 -m jsonschema --instance invalid-spdx.json spdx-3.0.1.schema.json; then
            echo "Invalid SPDX fixture unexpectedly passed its official schema" >&2
            exit 1
          fi
          jq 'del(.bomFormat)' \
            "$RUNNER_TEMP/laghu-supply-chain/config/laghu-cyclonedx-1.7.cdx.json" \
            > invalid-cyclonedx.json
          if python3 -m jsonschema --instance invalid-cyclonedx.json bom-1.7.schema.json; then
            echo "Invalid CycloneDX fixture unexpectedly passed its official schema" >&2
            exit 1
          fi
      - uses: actions/upload-artifact@v7
        with:
          name: laghu-supply-chain
          path: |
            ${{ runner.temp }}/laghu-supply-chain/config/laghu-build-manifest-v1.json
            ${{ runner.temp }}/laghu-supply-chain/config/laghu-spdx-3.0.1.spdx.json
            ${{ runner.temp }}/laghu-supply-chain/config/laghu-cyclonedx-1.7.cdx.json
            ${{ runner.temp }}/laghu-supply-chain/config/laghu-provenance-v1.json
          if-no-files-found: error
  attest-supply-chain:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: supply-chain
    permissions:
      contents: read
      id-token: write
      attestations: write
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Generate trusted-main supply-chain artifacts
        run: |
          cmake -S . -B "$RUNNER_TEMP/laghu-supply-chain" -G Ninja \
            -DCMAKE_CXX_COMPILER=g++-14
      - name: Attest supply-chain artifacts
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6
        with:
