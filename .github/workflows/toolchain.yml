# SPDX-License-Identifier: AGPL-3.0-only
name: Toolchain

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  toolchain:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: gcc-14-libstdc++
            compiler: g++-14
            packages: g++-14
          - name: clang-19-libc++
            compiler: clang++-19
            packages: clang-19 libc++-19-dev libc++abi-19-dev
            cxxflags: -stdlib=libc++
    name: ${{ matrix.name }}
    steps:
      - uses: actions/checkout@v7
      - name: Install compiler and standard library
        run: |
          sudo rm -f /etc/apt/sources.list.d/google-chrome.list \
            /etc/apt/sources.list.d/google-chrome.sources
          sudo add-apt-repository --yes ppa:ubuntu-toolchain-r/test
          sudo apt-get update
          sudo apt-get install --yes ninja-build ${{ matrix.packages }}
      - name: Verify C++23 toolchain contract
        env:
          CXXFLAGS: ${{ matrix.cxxflags }}
        run: scripts/check-toolchain --cxx "${{ matrix.compiler }}" --out "$RUNNER_TEMP/laghu-toolchain"
      - name: Verify full vendored static configuration
        if: matrix.name == 'gcc-14-libstdc++'
        run: |
          cmake -S . -B "$RUNNER_TEMP/laghu-full" -G Ninja \
            -DCMAKE_CXX_COMPILER="${{ matrix.compiler }}" \
            -DLAGHU_BUILD_PROFILE=FULL
          cmake --build "$RUNNER_TEMP/laghu-full" --target laghu_crypto_provider_test
          ctest --test-dir "$RUNNER_TEMP/laghu-full" --output-on-failure \
            -R '^laghu.crypto.provider$'
      - name: Verify Clang 19 crypto adapter
        if: matrix.name == 'clang-19-libc++'
        run: |
          cmake -S . -B "$RUNNER_TEMP/laghu-clang-crypto" -G Ninja \
            -DCMAKE_CXX_COMPILER="${{ matrix.compiler }}" \
            -DCMAKE_CXX_FLAGS="${{ matrix.cxxflags }}" \
            -DLAGHU_BUILD_PROFILE=CUSTOM \
            -DLAGHU_FEATURES=tls
          cmake --build "$RUNNER_TEMP/laghu-clang-crypto" \
            --target laghu_crypto_provider_test
          ctest --test-dir "$RUNNER_TEMP/laghu-clang-crypto" --output-on-failure \
            -R '^laghu.crypto.provider$'
      - name: Verify LibreSSL crypto adapter
        if: matrix.name == 'gcc-14-libstdc++'
        run: |
          cmake -S . -B "$RUNNER_TEMP/laghu-libressl" -G Ninja \
            -DCMAKE_CXX_COMPILER="${{ matrix.compiler }}" \
            -DLAGHU_BUILD_PROFILE=CUSTOM \
            -DLAGHU_FEATURES=tls \
            -DLAGHU_TLS_PROVIDER=LIBRESSL
          cmake --build "$RUNNER_TEMP/laghu-libressl" \
            --target laghu_crypto_provider_test
          ctest --test-dir "$RUNNER_TEMP/laghu-libressl" --output-on-failure \
            -R '^laghu.crypto.provider$'
      - name: Verify GCC 14 release reproducibility
        if: matrix.name == 'gcc-14-libstdc++'
        run: |
          cmake -S . -B "$RUNNER_TEMP/laghu-reproducible" -G Ninja \
            -DCMAKE_CXX_COMPILER="${{ matrix.compiler }}" \
            -DCMAKE_BUILD_TYPE=Release
          ctest --test-dir "$RUNNER_TEMP/laghu-reproducible" \
            --output-on-failure -R '^laghu.build.reproducible_staging$'
      - uses: actions/upload-artifact@v7
        with:
          name: toolchain-capabilities-${{ matrix.name }}
          path: |
            ${{ runner.temp }}/laghu-toolchain/config/laghu-config-v1.json
            ${{ runner.temp }}/laghu-toolchain/probes/toolchain-capabilities-v1.json
            ${{ runner.temp }}/laghu-toolchain/probes/*.log
          if-no-files-found: error
  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install canonical generator
        run: brew install ninja openssl@3
      - name: Verify Apple Clang toolchain contract
        run: scripts/check-toolchain --cxx clang++ --out "$RUNNER_TEMP/laghu-toolchain"
      - name: Verify Apple Clang crypto adapter
        run: |
          export PKG_CONFIG_PATH="$(brew --prefix openssl@3)/lib/pkgconfig"
          cmake -S . -B "$RUNNER_TEMP/laghu-crypto" -G Ninja \
            -DCMAKE_CXX_COMPILER=clang++ \
            -DLAGHU_BUILD_PROFILE=CUSTOM \
            -DLAGHU_FEATURES=tls \
            -DLAGHU_DEPENDENCY_SOURCE=SYSTEM \
            -DLAGHU_DEPENDENCY_LINK_MODE=DYNAMIC
          cmake --build "$RUNNER_TEMP/laghu-crypto" \
            --target laghu_crypto_provider_test
          ctest --test-dir "$RUNNER_TEMP/laghu-crypto" --output-on-failure \
            -R '^laghu.crypto.provider$'
      - uses: actions/upload-artifact@v7
        with:
          name: toolchain-capabilities-macos-appleclang
          path: |
            ${{ runner.temp }}/laghu-toolchain/config/laghu-config-v1.json
            ${{ runner.temp }}/laghu-toolchain/probes/toolchain-capabilities-v1.json
            ${{ runner.temp }}/laghu-toolchain/probes/*.log
          if-no-files-found: error
  freebsd:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: vmactions/freebsd-vm@f0552d3b69211736abd97f02ff3d4674c56b73b1
        with:
          release: '15.1'
          usesh: true
          prepare: pkg install -y cmake ninja gmake perl5
          run: |
            scripts/check-toolchain --cxx clang++ --out /tmp/laghu-toolchain
            cmake -S . -B /tmp/laghu-crypto -G Ninja \
              -DCMAKE_CXX_COMPILER=clang++ \
              -DLAGHU_BUILD_PROFILE=CUSTOM \
              -DLAGHU_FEATURES=tls
            cmake --build /tmp/laghu-crypto --target laghu_crypto_provider_test
            ctest --test-dir /tmp/laghu-crypto --output-on-failure \
              -R '^laghu.crypto.provider$'
  linux-aarch64-cross:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Install ARM64 GCC cross toolchain
        run: |
          sudo rm -f /etc/apt/sources.list.d/google-chrome.list \
            /etc/apt/sources.list.d/google-chrome.sources
          sudo add-apt-repository --yes ppa:ubuntu-toolchain-r/test
          sudo apt-get update
          sudo apt-get install --yes ninja-build g++-14-aarch64-linux-gnu
      - name: Configure, compile, archive, and validate ARM64 contract
        run: |
          cmake --preset linux-aarch64-gcc \
            -DLAGHU_BUILD_PROFILE=CUSTOM \
            -DLAGHU_FEATURES=tls
          cmake --build build/linux-aarch64-gcc --target laghu_verify_toolchain
      - name: Verify ARM64 archive
        run: |
          test -f build/linux-aarch64-gcc/liblaghu_core.a
          aarch64-linux-gnu-ar t build/linux-aarch64-gcc/liblaghu_core.a
          test -f build/linux-aarch64-gcc/liblaghu_crypto.a
          aarch64-linux-gnu-ar t build/linux-aarch64-gcc/liblaghu_crypto.a
  linux-clang-asan-ubsan:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Install Linux Clang ASan and UBSan toolchain
        run: |
          sudo rm -f /etc/apt/sources.list.d/google-chrome.list \
            /etc/apt/sources.list.d/google-chrome.sources
          sudo apt-get update
          sudo apt-get install --yes ninja-build clang-19 libclang-rt-19-dev libc++-19-dev libc++abi-19-dev
      - name: Run ordinary native suite under ASan and UBSan
        run: |
          cmake --preset linux-clang-asan-ubsan
          cmake --build build/linux-clang-asan-ubsan --target laghu_verify_toolchain
      - name: Run TLS crypto adapter under ASan and UBSan
        run: |
          cmake -S . -B "$RUNNER_TEMP/laghu-asan-crypto" -G Ninja \
            -DCMAKE_CXX_COMPILER=clang++-19 \
            -DCMAKE_CXX_FLAGS=-stdlib=libc++ \
            -DLAGHU_SANITIZER_PROFILE=ASAN_UBSAN \
            -DLAGHU_BUILD_PROFILE=CUSTOM \
            -DLAGHU_FEATURES=tls
          cmake --build "$RUNNER_TEMP/laghu-asan-crypto" \
            --target laghu_crypto_provider_test laghu_crypto_entropy_seam_test
          ctest --test-dir "$RUNNER_TEMP/laghu-asan-crypto" --output-on-failure \
            -R '^laghu.crypto.provider$'
          ctest --test-dir "$RUNNER_TEMP/laghu-asan-crypto" --output-on-failure \
            -R '^laghu.crypto.entropy_seam$'
      - name: Replay binary-envelope fuzz corpus under ASan and UBSan
        run: |
          cmake -S . -B "$RUNNER_TEMP/laghu-fuzz" -G Ninja \
            -DCMAKE_CXX_COMPILER=clang++-19 \
            -DLAGHU_SANITIZER_PROFILE=ASAN_UBSAN \
            -DLAGHU_BUILD_FUZZERS=ON
          scripts/fuzz --build "$RUNNER_TEMP/laghu-fuzz" \
            --target binary-envelope --corpus fuzz/corpus/binary-envelope --runs 1
          ctest --test-dir "$RUNNER_TEMP/laghu-fuzz" --output-on-failure \
            -R '^laghu\.fuzz\.wrapper$'
          ctest --test-dir "$RUNNER_TEMP/laghu-fuzz" --output-on-failure \
            -R '^laghu\.fuzz\.release_exclusion$'
          ctest --test-dir "$RUNNER_TEMP/laghu-fuzz" --output-on-failure \
            -R '^laghu\.fuzz\.default_all_exclusion$'
      - name: Run bounded binary-envelope fuzz campaign
        continue-on-error: true
        run: |
          scripts/fuzz --build "$RUNNER_TEMP/laghu-fuzz" \
            --target binary-envelope --corpus fuzz/corpus/binary-envelope --runs 10000
  linux-clang-tsan:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Install Linux Clang ThreadSanitizer toolchain
        run: |
          sudo rm -f /etc/apt/sources.list.d/google-chrome.list \
            /etc/apt/sources.list.d/google-chrome.sources
          sudo apt-get update
          sudo apt-get install --yes ninja-build clang-19 libc++-19-dev libc++abi-19-dev
      - name: Run concurrency targets under ThreadSanitizer
        run: |
          cmake --preset linux-clang-tsan
          cmake --build build/linux-clang-tsan --target laghu_sanitizer_tsan_tests
