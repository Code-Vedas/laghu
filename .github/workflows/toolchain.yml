# SPDX-License-Identifier: AGPL-3.0-only
name: Toolchain

on:
  pull_request:
  push:
    branches: [main]

jobs:
  toolchain:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: gcc-14-libstdc++
            compiler: g++-14
            packages: g++-14
          - name: clang-19-libc++
            compiler: clang++-19
            packages: clang-19 libc++-19-dev libc++abi-19-dev
            cxxflags: -stdlib=libc++
    name: ${{ matrix.name }}
    steps:
      - uses: actions/checkout@v4
      - name: Install compiler and standard library
        run: |
          sudo rm -f /etc/apt/sources.list.d/google-chrome.list \
            /etc/apt/sources.list.d/google-chrome.sources
          sudo add-apt-repository --yes ppa:ubuntu-toolchain-r/test
          sudo apt-get update
          sudo apt-get install --yes ninja-build ${{ matrix.packages }}
      - name: Verify C++23 toolchain contract
        env:
          CXXFLAGS: ${{ matrix.cxxflags }}
        run: scripts/check-toolchain --cxx "${{ matrix.compiler }}" --out "$RUNNER_TEMP/laghu-toolchain"
      - name: Verify full vendored static configuration
        if: matrix.name == 'gcc-14-libstdc++'
        run: |
          cmake -S . -B "$RUNNER_TEMP/laghu-full" -G Ninja \
            -DCMAKE_CXX_COMPILER="${{ matrix.compiler }}" \
            -DLAGHU_BUILD_PROFILE=FULL
          cmake --build "$RUNNER_TEMP/laghu-full" --target laghu_core
      - name: Verify GCC 14 release reproducibility
        if: matrix.name == 'gcc-14-libstdc++'
        run: |
          cmake -S . -B "$RUNNER_TEMP/laghu-reproducible" -G Ninja \
            -DCMAKE_CXX_COMPILER="${{ matrix.compiler }}" \
            -DCMAKE_BUILD_TYPE=Release
          ctest --test-dir "$RUNNER_TEMP/laghu-reproducible" \
            --output-on-failure -R '^laghu.build.reproducible_staging$'
      - uses: actions/upload-artifact@v4
        with:
          name: toolchain-capabilities-${{ matrix.name }}
          path: |
            ${{ runner.temp }}/laghu-toolchain/config/laghu-config-v1.json
            ${{ runner.temp }}/laghu-toolchain/probes/toolchain-capabilities-v1.json
            ${{ runner.temp }}/laghu-toolchain/probes/*.log
          if-no-files-found: error
  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install canonical generator
        run: brew install ninja
      - name: Verify Apple Clang toolchain contract
        run: scripts/check-toolchain --cxx clang++ --out "$RUNNER_TEMP/laghu-toolchain"
      - uses: actions/upload-artifact@v4
        with:
          name: toolchain-capabilities-macos-appleclang
          path: |
            ${{ runner.temp }}/laghu-toolchain/config/laghu-config-v1.json
            ${{ runner.temp }}/laghu-toolchain/probes/toolchain-capabilities-v1.json
            ${{ runner.temp }}/laghu-toolchain/probes/*.log
          if-no-files-found: error
  freebsd:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: vmactions/freebsd-vm@f0552d3b69211736abd97f02ff3d4674c56b73b1
        with:
          release: '15.1'
          usesh: true
          prepare: pkg install -y cmake ninja
          run: scripts/check-toolchain --cxx clang++ --out /tmp/laghu-toolchain
  linux-aarch64-cross:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install ARM64 GCC cross toolchain
        run: |
          sudo rm -f /etc/apt/sources.list.d/google-chrome.list \
            /etc/apt/sources.list.d/google-chrome.sources
          sudo add-apt-repository --yes ppa:ubuntu-toolchain-r/test
          sudo apt-get update
          sudo apt-get install --yes ninja-build g++-14-aarch64-linux-gnu
      - name: Configure, compile, archive, and validate ARM64 contract
        run: |
          cmake --preset linux-aarch64-gcc
          cmake --build build/linux-aarch64-gcc --target laghu_verify_toolchain
      - name: Verify ARM64 archive
        run: |
          test -f build/linux-aarch64-gcc/liblaghu_core.a
          aarch64-linux-gnu-ar t build/linux-aarch64-gcc/liblaghu_core.a
  linux-clang-tsan:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install Linux Clang ThreadSanitizer toolchain
        run: |
          sudo apt-get update
          sudo apt-get install --yes ninja-build clang-19
      - name: Run cancellation races under ThreadSanitizer
        run: |
          cmake -S . -B "$RUNNER_TEMP/laghu-tsan" -G Ninja \
            -DCMAKE_CXX_COMPILER=clang++-19 \
            -DLAGHU_ENABLE_TSAN=ON
          cmake --build "$RUNNER_TEMP/laghu-tsan" \
            --target laghu_core_deadlines_cancellation_tsan_test
          ctest --test-dir "$RUNNER_TEMP/laghu-tsan" --output-on-failure \
            -R '^laghu.core.deadlines_cancellation.tsan$'
