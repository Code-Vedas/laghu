name: Release Packages

on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  id-token: write
  packages: write
  attestations: write

jobs:
  validate:
    name: Validate release version
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Match the tag to the project version
        run: |
          version=${GITHUB_REF_NAME#v}
          grep -F "project(laghu VERSION ${version} LANGUAGES C)" CMakeLists.txt

  modules:
    name: Module · NGINX ${{ matrix.nginx_version }} · ${{ matrix.architecture }}
    needs: validate
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            architecture: x86_64
            nginx_version: "1.30.4"
          - runner: ubuntu-24.04
            architecture: x86_64
            nginx_version: "1.31.3"
          - runner: ubuntu-24.04-arm
            architecture: arm64
            nginx_version: "1.30.4"
          - runner: ubuntu-24.04-arm
            architecture: arm64
            nginx_version: "1.31.3"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            build-essential libpcre2-dev libssl-dev zlib1g-dev
      - run: scripts/run-module-build-all
        env:
          NGINX_VERSION: ${{ matrix.nginx_version }}
      - run: >-
          scripts/check-release-hardening
          tmp/nginx/${{ matrix.nginx_version }}/build/ngx_http_laghu_module.so
      - name: Assemble module archive
        run: |
          archive="ngx-laghu-${{ matrix.nginx_version }}-${{ matrix.architecture }}-linux"
          mkdir -p "tmp/release/${archive}"
          cp "tmp/nginx/${{ matrix.nginx_version }}/build/ngx_http_laghu_module.so" \
            "tmp/release/${archive}/"
          cp packaging/nginx/mod-http-laghu.conf packaging/nginx/laghu.conf \
            "tmp/release/${archive}/"
          tar -C tmp/release -czf "tmp/release/${archive}.tar.gz" "${archive}"
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: release-module-${{ matrix.nginx_version }}-${{ matrix.architecture }}
          path: tmp/release/*.tar.gz

  apache_module:
    name: Module · Apache 2.4 · ${{ matrix.architecture }}
    needs: validate
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            architecture: x86_64
          - runner: ubuntu-24.04-arm
            architecture: arm64
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y apache2-dev
      - run: scripts/build-apache-module
      - run: scripts/check-release-hardening tmp/apache-module/.libs/mod_laghu.so
      - name: Assemble module archive
        run: |
          archive="mod-laghu-apache-2.4-${{ matrix.architecture }}-linux"
          mkdir -p "tmp/release/${archive}"
          cp tmp/apache-module/.libs/mod_laghu.so packaging/apache/laghu.load \
            packaging/apache/laghu.conf "tmp/release/${archive}/"
          tar -C tmp/release -czf "tmp/release/${archive}.tar.gz" "${archive}"
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: release-apache-${{ matrix.architecture }}
          path: tmp/release/*.tar.gz

  deb:
    name: Debian · ${{ matrix.architecture }}
    needs: validate
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            architecture: amd64
          - runner: ubuntu-24.04-arm
            architecture: arm64
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Install package dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            apache2 apache2-dev cmake debhelper devscripts dh-apache2 \
            dh-sequence-nginx libvips-dev nginx nginx-dev pkgconf
      - name: Build package set
        run: |
          cp -R packaging/debian debian
          dpkg-buildpackage --build=binary --no-sign
          nginx -t
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: release-deb-${{ matrix.architecture }}
          path: ../*laghu*.deb

  rpm:
    name: RPM · ${{ matrix.architecture }}
    needs: validate
    runs-on: ${{ matrix.runner }}
    container: fedora:44
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            architecture: x86_64
          - runner: ubuntu-24.04-arm
            architecture: aarch64
    steps:
      - name: Install package dependencies
        run: >-
          dnf install -y cargo cmake gcc git gzip httpd httpd-devel make nginx nginx-mod-devel rust
          pkgconf-pkg-config rpm-build shadow-utils systemd-rpm-macros tar
          vips-devel
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Build package set
        run: |
          mkdir -p "$HOME/rpmbuild/SOURCES" "$HOME/rpmbuild/SPECS"
          tar --exclude=.git --exclude=tmp \
            --transform='s,^\.,laghu-0.1.0,' -czf \
            "$HOME/rpmbuild/SOURCES/laghu-0.1.0.tar.gz" .
          cp packaging/rpm/laghu.spec "$HOME/rpmbuild/SPECS/laghu.spec"
          rpmbuild -ba "$HOME/rpmbuild/SPECS/laghu.spec"
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: release-rpm-${{ matrix.architecture }}
          path: ~/rpmbuild/RPMS/**/*.rpm

  container:
    name: ${{ matrix.offering }} multi-architecture container
    needs: validate
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        include:
          - offering: ngx-laghu
            dockerfile: packaging/container/Dockerfile
          - offering: mod-laghu
            dockerfile: packaging/container/Dockerfile.apache
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: docker/setup-qemu-action@1f40c72289eff860ee54a304f1438e3cff362e0a # v4
      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ghcr.io/code-vedas/${{ matrix.offering }}:scan-${{ github.sha }}
      - id: image
        name: Record published image digest
        run: |
          set -eu
          digest='${{ steps.build.outputs.digest }}'
          if ! printf '%s\n' "${digest}" | grep -Eq '^sha256:[0-9a-f]{64}$'; then
            echo "Build did not return an OCI SHA-256 digest: ${digest}" >&2
            exit 1
          fi
          image="ghcr.io/code-vedas/${{ matrix.offering }}@${digest}"
          mkdir -p tmp/release
          printf '%s\n' "${image}" >"tmp/release/${{ matrix.offering }}.image-digest.txt"
          printf 'ref=%s\n' "${image}" >>"${GITHUB_OUTPUT}"
      - name: Record complete CVE findings for published image
        uses: aquasecurity/trivy-action@a9c7b0f06e461e9d4b4d1711f154ee024b8d7ab8 # v0.36.0
        with:
          image-ref: ${{ steps.image.outputs.ref }}
          version: v0.74.0
          format: json
          output: tmp/release/${{ matrix.offering }}.trivy.json
          severity: UNKNOWN,LOW,MEDIUM,HIGH,CRITICAL
          ignore-unfixed: false
          vuln-type: os,library
          scanners: vuln
          exit-code: 0
      - name: Gate fixed high and critical CVEs
        uses: aquasecurity/trivy-action@a9c7b0f06e461e9d4b4d1711f154ee024b8d7ab8 # v0.36.0
        with:
          image-ref: ${{ steps.image.outputs.ref }}
          version: v0.74.0
          format: table
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          vuln-type: os,library
          scanners: vuln
          exit-code: 1
          skip-setup-trivy: true
      - name: Promote scanned image digest
        run: |
          docker buildx imagetools create \
            --tag "ghcr.io/code-vedas/${{ matrix.offering }}:${{ github.ref_name }}" \
            --tag "ghcr.io/code-vedas/${{ matrix.offering }}:stable" \
            "${{ steps.image.outputs.ref }}"
      - name: Retain image digest and CVE findings
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: release-container-security-${{ matrix.offering }}
          path: |
            tmp/release/${{ matrix.offering }}.image-digest.txt
            tmp/release/${{ matrix.offering }}.trivy.json
          if-no-files-found: error

  publish_assets:
    name: Publish release assets
    needs: [modules, apache_module, deb, rpm, container]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          pattern: release-*
          path: release-assets
          merge-multiple: true
      - uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0
        with:
          path: release-assets
          format: spdx-json
          output-file: release-assets/laghu.spdx.json
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: Create release and upload assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          (cd release-assets && sha256sum * >SHA256SUMS)
          cosign sign-blob --yes --output-signature release-assets/SHA256SUMS.sig \
            --output-certificate release-assets/SHA256SUMS.pem \
            release-assets/SHA256SUMS
          gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1 || \
            gh release create "${GITHUB_REF_NAME}" --verify-tag --generate-notes
          gh release upload "${GITHUB_REF_NAME}" release-assets/* --clobber
      - uses: actions/attest-build-provenance@8beda2b7ed98355c0e97c0a63bec38ae472e66c4 # v4
        with:
          subject-path: release-assets/*
