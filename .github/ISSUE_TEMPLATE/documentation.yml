name: Documentation issue
description: Report missing, unclear, stale, or contradictory product documentation.
title: "docs: "
labels: [docs]
body:
  - type: input
    id: page
    attributes:
      label: Page or file
      placeholder: https://laghu.codevedas.com/... or docs/pages/...
    validations:
      required: true
  - type: textarea
    id: issue
    attributes:
      label: Problem
      description: Explain what is inaccurate, unclear, or missing.
    validations:
      required: true
  - type: textarea
    id: suggestion
    attributes:
      label: Suggested correction

