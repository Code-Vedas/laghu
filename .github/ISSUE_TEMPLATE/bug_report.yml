name: Bug report
description: Report incorrect Laghu behavior or a reproducible build failure.
title: "bugfix: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Do not report security vulnerabilities here. Use private vulnerability reporting.
  - type: input
    id: version
    attributes:
      label: Laghu revision or version
      placeholder: commit SHA or release
    validations:
      required: true
  - type: input
    id: nginx
    attributes:
      label: NGINX version and configure arguments
      placeholder: nginx -V output
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: Description
      description: Explain expected and actual behavior.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction
      description: Provide a minimal config, request, response headers, and commands.
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Include OS, architecture, compiler, and loaded modules.
    validations:
      required: true
  - type: checkboxes
    id: checks
    attributes:
      label: Checks
      options:
        - label: I searched existing issues.
          required: true
        - label: This report does not contain an unpatched vulnerability.
          required: true

